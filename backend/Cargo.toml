[package]
name = "bcrm-backend"
version = "0.1.0"
edition = "2021"
description = "客户管理系统后端：61 张表的通用 CRUD + 动态查询引擎"
license = "MIT"

[dependencies]
axum = "0.8.9"
form_urlencoded = "1.2.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
