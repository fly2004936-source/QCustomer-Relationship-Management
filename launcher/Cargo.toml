[package]
name = "bcrm-desktop"
version = "1.0.0"
edition = "2021"
description = "BCRM 客户管理系统 · Windows 桌面版（Tauri 壳 + 内嵌 axum 后端）"
license = "MIT"

# 显式声明成独立 workspace 根，避免 cargo 向上找到了别的 workspace
[workspace]

[[bin]]
name = "bcrm-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 同一个进程里内嵌的后端库（axum + rusqlite + 通用 CRUD 引擎）
bcrm-backend = { path = "../backend" }
tauri = { version = "2", features = [] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
